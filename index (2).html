<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff0f6"><title>لسجوجتي الغالية 💗</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#ffe0ed,transparent 35%),radial-gradient(circle at 80% 90%,#eedcff,transparent 40%),#fff8fb;font-family:Tahoma,Arial,sans-serif;color:#78335e;overflow:hidden}.card{position:relative;text-align:center;width:min(92vw,480px);padding:52px 25px;border:1px solid #fff;background:#ffffffb8;box-shadow:0 24px 80px #b85c912b;border-radius:32px;backdrop-filter:blur(12px);animation:rise 1s ease both}.tag{font-size:14px;letter-spacing:1px;color:#a35b89}.cake{font-size:76px;animation:bob 2.6s ease-in-out infinite;margin:20px 0}h1{font-size:clamp(27px,7vw,39px);line-height:1.7;color:#b83280;margin:8px 0 14px}.message{font-size:clamp(18px,4.7vw,24px);line-height:2;font-weight:bold}.footer{font-size:16px;line-height:2;margin-top:24px;color:#a6658e}.heart{position:fixed;bottom:-40px;pointer-events:none;animation:float linear infinite;opacity:.65}@keyframes float{to{transform:translateY(-115vh) rotate(35deg);opacity:0}}@keyframes rise{from{opacity:0;transform:translateY(25px) scale(.97)}to{opacity:1;transform:none}}@keyframes bob{50%{transform:translateY(-9px)}}button{border:0;border-radius:999px;padding:13px 25px;background:#c83d8e;color:white;font-weight:bold;font-size:16px;cursor:pointer;box-shadow:0 8px 20px #c83d8e44}#surprise{display:none;margin-top:20px;font-size:18px;line-height:1.9;color:#a72973}</style></head><body><main class="card"><div class="tag">A LITTLE BIRTHDAY SURPRISE ✨</div><div class="cake">🎂</div><h1>عيد ميلاد سعيد يا سجوجتي! 🎀</h1><div class="message">كل عام وإنتِ بألف خير يا أعز الأصدقاء،<br>حبيبتي سجوجتي الغالية 💗</div><p class="footer">يا رب تكون كل أيامك فرح وحب، وتتحقق كل أمنياتك يا أحلى صديقة بالدنيا 🥹💕</p><button onclick="document.getElementById('surprise').style.display='block';burst()">اضغطي هون يا حلوة 🎁</button><div id="surprise">بحبك قد الدنيا وأكثر! 💖<br>وجودك بحياتي أحلى هدية 🫶</div></main><script>function heart(){let e=document.createElement('span');e.className='heart';e.textContent=['💗','💕','🌸','✨','🎀'][Math.random()*5|0];e.style.left=Math.random()*100+'vw';e.style.fontSize=15+Math.random()*22+'px';e.style.animationDuration=5+Math.random()*6+'s';document.body.append(e);setTimeout(()=>e.remove(),11000)}setInterval(heart,430);function burst(){for(let i=0;i<25;i++)setTimeout(heart,i*55)}</script></body></html>
